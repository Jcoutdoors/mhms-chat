<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cookie proof test</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 24px; color: #111; }
  h1 { font-size: 18px; }
  .note { color: #666; font-size: 13px; margin-bottom: 20px; }
  button { font-size: 18px; padding: 14px 22px; border: 0; border-radius: 10px;
           background: #2b59ff; color: #fff; }
  button:disabled { background: #9bb0ff; }
  #panel { margin-top: 22px; border: 1px solid #ddd; border-radius: 10px; padding: 8px 14px;
           max-width: 360px; display: none; }
  .row { display: flex; justify-content: space-between; padding: 8px 0;
         border-bottom: 1px solid #eee; }
  .row:last-child { border-bottom: 0; font-weight: 700; }
  .pass { color: #0a7a2f; font-weight: 700; }
  .fail { color: #c1121f; font-weight: 700; }
  .pending { color: #999; }
</style>
</head>
<body>
  <h1>Collier cookie proof test</h1>
  <p class="note">Proof-only feasibility harness. Not production authentication. No identity,
  no secrets. Talks only to <code>auth.mentalhealthmadesimple.life/proof/*</code>. The cookie
  value is never read or shown.</p>

  <button id="run">Run Cookie Test</button>

  <div id="panel">
    <div class="row"><span>Set</span><span id="r-set" class="pending">—</span></div>
    <div class="row"><span>HttpOnly (JS cannot read)</span><span id="r-http" class="pending">—</span></div>
    <div class="row"><span>Cookie returned</span><span id="r-ret" class="pending">—</span></div>
    <div class="row"><span>Logout</span><span id="r-out" class="pending">—</span></div>
    <div class="row"><span>Final status</span><span id="r-fin" class="pending">—</span></div>
  </div>

<script>
  var AUTH = 'https://auth.mentalhealthmadesimple.life';
  function mark(id, ok) {
    var el = document.getElementById(id);
    el.textContent = ok ? 'Pass' : 'Fail';
    el.className = ok ? 'pass' : 'fail';
  }
  document.getElementById('run').addEventListener('click', async function () {
    var btn = this; btn.disabled = true;
    document.getElementById('panel').style.display = 'block';
    ['r-set','r-http','r-ret','r-out','r-fin'].forEach(function (i) {
      var e = document.getElementById(i); e.textContent = '…'; e.className = 'pending';
    });
    var set = false, httpOnly = false, returned = false, loggedOut = false, cleared = false;
    try {
      var s = await fetch(AUTH + '/proof/set', { method: 'POST', credentials: 'include' });
      var sb = await s.json();
      set = s.status === 200 && sb.ok === true && sb.set === true;
      mark('r-set', set);

      // HttpOnly: script must NOT be able to see the cookie.
      httpOnly = document.cookie.indexOf('collier_auth_proof') === -1;
      mark('r-http', httpOnly);

      var c1 = await fetch(AUTH + '/proof/check', { credentials: 'include' });
      returned = (await c1.json()).cookiePresent === true;
      mark('r-ret', returned);

      var o = await fetch(AUTH + '/proof/logout', { method: 'POST', credentials: 'include' });
      var ob = await o.json();
      loggedOut = ob.ok === true && ob.cleared === true;
      mark('r-out', loggedOut);

      var c2 = await fetch(AUTH + '/proof/check', { credentials: 'include' });
      cleared = (await c2.json()).cookiePresent === false;
    } catch (e) {
      // Leave any unset rows as Fail; do not surface details/values.
    }
    if (document.getElementById('r-ret').textContent === '…') mark('r-ret', false);
    if (document.getElementById('r-out').textContent === '…') mark('r-out', false);
    mark('r-fin', set && httpOnly && returned && loggedOut && cleared);
    btn.disabled = false;
  });
</script>
</body>
</html>
