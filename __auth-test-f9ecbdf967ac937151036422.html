<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- TEMPORARY authentication test harness (VIF Phase 3 browser matrix).
     Unlinked, unindexed, to be removed immediately after testing.
     Same-origin as the chat app so credentialed requests to auth.* are allowed. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Temporary authentication test</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 620px; margin: 0 auto; padding: 20px; line-height: 1.45; }
  .banner { background: #b45309; color: #fff; padding: 10px 14px; border-radius: 8px; font-weight: 700; }
  .banner small { display:block; font-weight: 400; opacity: .9; }
  fieldset { border: 1px solid #8888; border-radius: 8px; margin: 14px 0; padding: 12px 14px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: block; font-size: 13px; margin: 8px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px; font-size: 15px; border: 1px solid #8888; border-radius: 6px; background: transparent; color: inherit; }
  button { margin: 8px 6px 0 0; padding: 9px 14px; font-size: 14px; font-weight: 600; border: 1px solid #8888; border-radius: 6px; cursor: pointer; background: #2563eb; color: #fff; }
  button.secondary { background: transparent; color: inherit; }
  #status { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; background: #8881; border-radius: 8px; padding: 12px; min-height: 90px; margin-top: 8px; }
  .row { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; }
  .kv { font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
  <div class="banner">Temporary authentication test
    <small>Isolated VIF Phase 3 browser-matrix harness. Not part of the app. Will be removed after testing. Do not share this URL.</small>
  </div>

  <fieldset>
    <legend>1 &middot; Request code</legend>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="off" placeholder="you@example.com">
    <button id="btnRequest">Request code</button>
  </fieldset>

  <fieldset>
    <legend>2 &middot; Verify code</legend>
    <label for="code">Six-digit code</label>
    <input id="code" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000">
    <button id="btnVerify">Verify code</button>
  </fieldset>

  <fieldset>
    <legend>3 &middot; Session</legend>
    <div class="row">
      <button id="btnToken" class="secondary">Check authenticated token status</button>
      <button id="btnLogout" class="secondary">Logout</button>
    </div>
    <p class="kv" id="cookieVisibility">document.cookie exposes session: &mdash;</p>
  </fieldset>

  <div id="status" aria-live="polite">Ready.</div>

<script>
(function () {
  "use strict";
  var AUTH = "https://auth.mentalhealthmadesimple.life";
  var statusEl = document.getElementById("status");
  var cookieVisEl = document.getElementById("cookieVisibility");

  // Mask an email so full addresses never land in the visible status log.
  function maskEmail(e) {
    if (!e || e.indexOf("@") < 0) return "(hidden)";
    var p = e.split("@");
    var u = p[0];
    return (u.length <= 1 ? u : u[0] + "***") + "@" + p[1];
  }
  function log(line) {
    var t = new Date().toLocaleTimeString();
    statusEl.textContent = "[" + t + "] " + line + "\n" + statusEl.textContent;
  }
  // Never expose the HttpOnly session cookie; this only reports presence/absence.
  function refreshCookieVisibility() {
    var visible = document.cookie.indexOf("__Host-collier_session") !== -1;
    cookieVisEl.textContent = "document.cookie exposes session: " + (visible ? "YES (unexpected!)" : "no (expected — HttpOnly)");
  }
  refreshCookieVisibility();

  // Minimal, sanitized POST helper. Returns { httpStatus, ok, errorCategory, data }.
  // Only whitelisted fields are ever surfaced to the caller/UI.
  async function post(path, bodyObj) {
    var res, json = null;
    try {
      res = await fetch(AUTH + path, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(bodyObj || {})
      });
    } catch (netErr) {
      // Do not surface raw network/server error text.
      return { httpStatus: 0, ok: false, errorCategory: "network_error", data: null };
    }
    try { json = await res.json(); } catch (e) { json = null; }
    return {
      httpStatus: res.status,
      ok: !!(json && json.ok),
      errorCategory: (json && json.error) ? String(json.error) : null,
      data: json
    };
  }

  document.getElementById("btnRequest").addEventListener("click", async function () {
    var email = document.getElementById("email").value.trim();
    if (!email) { log("Enter an email first."); return; }
    log("Requesting code for " + maskEmail(email) + " …");
    var r = await post("/verify/request", { email: email });
    if (r.ok) log("Code requested (HTTP " + r.httpStatus + "). Check the inbox.");
    else log("Request not accepted (HTTP " + r.httpStatus + (r.errorCategory ? ", " + r.errorCategory : "") + ").");
  });

  document.getElementById("btnVerify").addEventListener("click", async function () {
    var email = document.getElementById("email").value.trim();
    var code = document.getElementById("code").value.trim();
    if (!email || !code) { log("Enter email and the six-digit code."); return; }
    log("Verifying code …");
    var r = await post("/verify/submit", { email: email, code: code });
    // Clear the code field immediately; never echo the code back.
    document.getElementById("code").value = "";
    if (r.ok) log("Verified ✓ (HTTP " + r.httpStatus + "). Session cookie should now be set.");
    else log("Verification failed (HTTP " + r.httpStatus + (r.errorCategory ? ", " + r.errorCategory : "") + ").");
    refreshCookieVisibility();
  });

  document.getElementById("btnToken").addEventListener("click", async function () {
    log("Checking token status …");
    var r = await post("/token", {});
    if (r.ok) {
      // Surface ONLY: authenticated, user_id, token-received. Never the token value.
      var uid = (r.data && r.data.user_id) ? r.data.user_id : "(none)";
      var tokenReceived = !!(r.data && r.data.token);
      log("authenticated: yes\nuser_id: " + uid + "\ntoken received: " + (tokenReceived ? "yes" : "no") + "\n(HTTP " + r.httpStatus + ")");
    } else {
      log("authenticated: no (HTTP " + r.httpStatus + (r.errorCategory ? ", " + r.errorCategory : "") + ")");
    }
    refreshCookieVisibility();
  });

  document.getElementById("btnLogout").addEventListener("click", async function () {
    log("Logging out …");
    var r = await post("/logout", {});
    log("Logout " + (r.ok ? "ok" : "response") + " (HTTP " + r.httpStatus + ").");
    refreshCookieVisibility();
  });
})();
</script>
</body>
</html>
